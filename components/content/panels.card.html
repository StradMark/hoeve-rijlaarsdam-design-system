<!-- @dsCard group="Inhoudsblokken" viewport="900x420" name="BenefitsPanel" subtitle="Opsomming met gouden haarlijnstreepjes, in beide tonen — vast paar met SplitPanel" -->
<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-display);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-500);margin:0 0 10px}.note{font-size:11px;line-height:1.65;color:var(--text-muted);margin:16px 0 0}.note b{color:var(--text-body);font-weight:500}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { BenefitsPanel } = window.HoeveRijlaarsdamDesignSystem_374762;
const ITEMS=['Gratis wifi','Groot presentatiescherm','Flip-over en stiften','Catering op maat','Gratis parkeren'];
ReactDOM.createRoot(document.getElementById('root')).render(
  <React.Fragment>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
      <div>
        <p className="lbl">Op het donkergroene paneel</p>
        <BenefitsPanel kicker="alle" title="Faciliteiten" items={ITEMS} style={{padding:'20px 24px'}}/>
      </div>
      <div>
        <p className="lbl">Op sage</p>
        <BenefitsPanel tone="sage" kicker="alle" title="Faciliteiten" items={ITEMS} style={{padding:'20px 24px'}}/>
      </div>
    </div>
    <p className="note"><b>Elk item krijgt een gouden haarlijnstreepje</b> &mdash; dezelfde getrokken lijn als
    onder de zaalonderschriften. Zonder marker leest de lijst als een alinea die per ongeluk is afgebroken, en
    een bolletje of vinkje hoort niet bij dit merk. Op het donkere paneel is het streepje kaarslichtgoud, op
    sage wit. <b>Vast paar met <code>SplitPanel</code>:</b> alle toepassingen op de site zijn een foto aan de
    ene kant en dit paneel aan de andere. <code>SplitPanel</code> is alleen de layout en heeft geen eigen
    inhoud &mdash; zet er dus dit paneel in, geen losse tekst.</p>
  </React.Fragment>
);
</script></body></html>
