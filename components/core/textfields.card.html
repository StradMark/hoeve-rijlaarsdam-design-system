<!-- @dsCard group="Formulier" viewport="1180x680" name="Tekstvelden" subtitle="Input in alle staten — leeg, ingevuld, met hint, met fout, meerregelig en als datum — op de drie vlakken" -->
<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:28px 32px;background:var(--surface-page)}.lbl{font-family:var(--font-display);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-500);margin:0 0 14px}.pane{padding:var(--space-6);display:grid;gap:var(--space-3);align-content:start}.row{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-grid)}.note{font-size:11.5px;line-height:1.7;color:var(--text-muted);max-width:94ch;margin:22px 0 0}.note b{color:var(--text-body);font-weight:500}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Input } = window.HoeveRijlaarsdamDesignSystem_374762;
function Card(){
  const [mail,setMail]=React.useState('post@');
  const geldig=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail);
  return <React.Fragment>
    <div className="row">
      <div className="pane" style={{background:'var(--surface-deep)'}}>
        <p className="lbl" style={{color:'var(--sage-200)'}}>Op het donkergroene paneel &mdash; waar het offerteformulier staat</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'var(--space-3)'}}>
          <Input label="Voornaam" required/>
          <Input label="Achternaam" defaultValue="Rijlaarsdam"/>
        </div>
        <Input label="E-mailadres" type="email" value={mail} onChange={e=>setMail(e.target.value)}
          error={geldig?undefined:'Vul een geldig e-mailadres in.'}/>
        <Input label="Uw vraag of wens" multiline rows={3}
          hint="Aantal gasten, datum en gelegenheid helpen ons het meest."/>
        <Input label="Gewenste datum" type="date"/>
      </div>
      <div style={{display:'grid',gap:'var(--gap-grid)',alignContent:'start'}}>
        <div className="pane" style={{background:'var(--surface-sage)'}}>
          <p className="lbl" style={{color:'var(--white)'}}>Op sage</p>
          <Input label="Telefoonnummer" tone="onSage" type="tel" defaultValue="06 - 42 57 63 95"/>
          <Input label="Aantal gasten" tone="onSage" hint="Een schatting is genoeg."/>
        </div>
        <div className="pane" style={{background:'var(--surface-cream)'}}>
          <p className="lbl">Op cr&egrave;me en wit</p>
          <Input label="Zoeken in de agenda" tone="onLight"/>
          <Input label="Postcode" tone="onLight" error="Wij herkennen deze postcode niet."/>
          <Input label="Uitgeschakeld" tone="onLight" defaultValue="Niet te wijzigen" disabled/>
        </div>
      </div>
    </div>
    <p className="note"><b>Het label is de enige uitleg.</b> Er staat geen los kopje boven het veld: leeg zit het
    label in het veld, gevuld staat het erboven. Zet er dus nooit een placeholder bij die hetzelfde zegt.
    <b>Stel <code>tone</code> in op de band waar het veld staat</b> &mdash; op donkergroen cr&egrave;me, op sage
    wit, op licht inkt. <b>Een datumveld staat altijd omhoog</b>, want het tekent zelf al dd-mm-jjjj. En een fout
    verdwijnt zodra hij is opgelost: typ hierboven een geldig adres en de melding gaat weg.</p>
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
