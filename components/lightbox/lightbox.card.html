<!-- @dsCard group="Inhoudsblokken" viewport="1180x880" name="Lightbox" subtitle="Eén foto op ware grootte boven de pagina — diepgroen in plaats van zwart, met Escape, pijltoetsen en een echte sluitknop" -->
<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px 32px;background:var(--surface-page)}
.lbl{font-family:var(--font-display);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-500);margin:0 0 12px}
.stage{position:relative;height:430px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-hairline)}
.note{font-size:11.5px;line-height:1.7;color:var(--text-muted);max-width:96ch;margin:18px 0 0}
.note b{color:var(--text-body);font-weight:500}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.thumbs button{padding:0;border:0;background:none;cursor:pointer;aspect-ratio:4/3;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Lightbox } = window.HoeveRijlaarsdamDesignSystem_374762;
const A='../../assets/';const FOTOS=[
  {src:A+'photo-beeldentuin-vogels.jpg',caption:'Bronzen vogels in de beeldentuin'},
  {src:A+'photo-roos-portret.jpg',caption:'Roos Rijlaarsdam, gastvrouw'},
  {src:A+'photo-koetshuis-expositie.jpg',caption:'Expositie in het Koetshuis'},
  {src:A+'photo-lounge-zonsondergang.jpg',caption:'De lounge bij zonsondergang'}
];
function Card(){
  const [zoom,setZoom]=React.useState(null);
  /* De gebundelde componenten lopen één compilatie achter op de bron; zonder deze controle
     is de hele kaart een wit vlak in plaats van alleen het onderdeel dat nog moet compileren. */
  if(!Lightbox) return <p className="note">De lightbox is nog niet gecompileerd — herlaad na de volgende build.</p>;
  return <React.Fragment>
    <p className="lbl">Klik een foto &mdash; Escape, de pijltoetsen en een klik naast het beeld werken ook.
      Het portret staat er met opzet tussen: de pijlen blijven aan de rand staan, ook bij een smaller beeld.</p>
    <div className="thumbs">
      {FOTOS.map((f,i)=>
        <button key={f.src} onClick={()=>setZoom(i)} aria-label={'Bekijk '+f.caption}>
          <img src={f.src} alt=""/>
        </button>)}
    </div>
    <div className="stage">
      {zoom!==null
        ? <Lightbox items={FOTOS} index={zoom} onIndex={setZoom} onClose={()=>setZoom(null)}
            style={{position:'absolute'}}/>
        : <div style={{height:'100%',display:'grid',placeItems:'center',color:'var(--text-muted)',
            fontSize:'var(--fs-body-s)'}}>Gesloten &mdash; klik hierboven een foto</div>}
    </div>
    <p className="note"><b>Diepgroen op 94 procent, geen zwart</b> &mdash; het merk heeft geen zwart, en een
    zwarte overlay laat de foto&rsquo;s kouder ogen dan ze zijn. <b>Overal een weg terug:</b> Escape, een klik
    naast de foto, en een <code>Sluiten</code>-knop met tekst in plaats van een kruisje in een hoek. De focus
    keert terug naar het element dat de lightbox opende en de pagina erachter scrollt niet mee. Pijlen en de
    teller verschijnen alleen bij meer dan één foto. <b>Alleen voor grootweergave</b> &mdash; moet een beeld
    doorlinken naar een pagina, gebruik dan een kaart met een echte link.</p>
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
