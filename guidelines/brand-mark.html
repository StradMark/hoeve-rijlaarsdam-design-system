<!-- @dsCard group="Merk" viewport="700x200" name="Schuurmerk" subtitle="Het monogram als SVG — kleur, mono en op klein formaat" -->
<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body>
<div style="display:flex;gap:26px;align-items:center">
<img src="../assets/logo-mark.svg" alt="Hoeve Rijlaarsdam" style="height:96px">
<img src="../assets/logo-mark.svg" alt="" style="height:44px">
<img src="../assets/logo-mark.svg" alt="" style="height:24px" title="24px — te klein">
<div style="background:var(--surface-deep);padding:16px 20px;display:flex;align-items:center;gap:18px;color:var(--cream-100)">
<img src="../assets/logo-mark-mono.svg" alt="" style="height:64px;filter:brightness(0) invert(1)">
<img src="../assets/logo-mark-mono.svg" alt="" style="height:24px;filter:brightness(0) invert(1)">
</div>
<div style="font-size:11px;color:var(--ink-300);max-width:32ch;line-height:1.6"><code>logo-mark.svg</code> in kleur, <code>logo-mark-mono.svg</code> volgt <code>currentColor</code> voor éénkleurig gebruik. Nooit hertekend of van kleur veranderd.<br><b style="color:var(--ink-500);font-weight:500">Minimaal 32px hoog</b> — de balken lopen daaronder in elkaar over (zie het specimen van 24px).</div>
</div>
</body></html>
