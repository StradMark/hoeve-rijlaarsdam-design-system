<style>

/* --- de pen ---------------------------------------------------------------
   Elke haal is een maskerlijn die zich in schrijfrichting aftrekt. De dash is iets langer dan het pad
   (het penpunt staat bij t=0 buiten de letter), de stokken van de H zijn in vijf overlappende stukken
   geknipt die rond het kruispunt tot 1,35 knijpen — smaller dan de inkt — zodat de dwarsstreep niet
   meelicht voordat de pen er is. Alle tijden komen uit variabelen, zodat elke variant alleen die
   variabelen zet. */

const NOTE={v1:'De H in \u00e9\u00e9n vlotte beweging, caps en schuurmerk landen samen in het goud.',

const svgHTML=stage.innerHTML;
function play(v){

  hint.innerHTML='<b>'+META[cur][0]+'</b> \u00b7 '+META[cur][1]+' \u00b7 '+NOTE[cur]+' \u2014 klik op het logo om opnieuw te schrijven';

}

</script>
