<script>
const $=id=>document.getElementById(id);
const stage=$('stage'),rij=$('rij'),ruleG=$('rule'),ae=$('ae'),barn=$('barn');
const PENS=[['penH',700],['penO',330],['penE1',330],['penV',300],['penE2',330],['penTail',560]];
const LEN={};PENS.forEach(([id])=>{const p=$(id);LEN[id]=p.getTotalLength();
  p.setAttribute('stroke-dasharray',LEN[id])});
// schrijfschema: elke letter begint 50ms voor het einde van de vorige, zodat de haal doorloopt
const SCHED=[];let t=200;PENS.forEach(([id,dur],i)=>{SCHED.push({id,start:t,dur,last:i===PENS.length-1});t+=dur-50});
const T_RIJ=t+320,T_RULE=t+860,T_BARN=t+1340,T_AE=t+1960,DURATION=T_AE+620+400;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeWrite=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const easeOut=k=>1-Math.pow(1-k,2);
const easeOut3=k=>1-Math.pow(1-k,3);
const back=k=>{const c=1.7;return 1+2.6*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
/* Alles is een pure functie van de tijd — daardoor kan de animatie zowel spelen als frame voor
   frame geëxporteerd worden (zie exportFrames / de GIF in assets/). */
function seek(ms){
  SCHED.forEach(({id,start,dur,last})=>{
    const k=cl((ms-start)/dur,0,1),e=last?easeOut(k):easeWrite(k);
    $(id).setAttribute('stroke-dashoffset',LEN[id]*(1-e));
  });
  const kr=cl((ms-T_RIJ)/660,0,1);
  rij.style.transform='translateY('+(88*(1-easeOut3(kr)))+'px)';
  rij.style.opacity=cl((ms-T_RIJ)/360,0,1);
  ruleG.style.transformOrigin='15px 234px';
  ruleG.style.transform='scaleX('+easeOut3(cl((ms-T_RULE)/540,0,1))+')';
  const kb=cl((ms-T_BARN)/780,0,1),eb=kb>=1?1:back(kb);
  barn.style.opacity=cl((ms-T_BARN)/140,0,1);
  barn.style.transform='translate(14px,31px) scale(0.963) translateY('+(-320*(1-eb))+'px) rotate('+(-8*(1-eb))+'deg)';
  ae.style.opacity=cl((ms-T_AE)/620,0,1);
}
let raf=0;
function play(){
  cancelAnimationFrame(raf);
  const t0=performance.now();
  (function step(now){const ms=now-t0;seek(ms);if(ms<DURATION)raf=requestAnimationFrame(step)})(t0);
}
// De rusttoestand IS het afgemaakte logo; klikken speelt de animatie opnieuw.
seek(DURATION);
stage.addEventListener('click',play);
// Zet de pagina klaar voor beeldexport: alleen het logo, schermvullend vanaf linksboven.
window.exportMode=()=>{document.querySelector('.hint').style.display='none';
  document.body.style.cssText='margin:0;background:#fff;display:block';
  stage.style.width='100vw';stage.querySelector('svg').style.display='block';return DURATION};
window.seek=seek;window.play=play;window.DURATION=DURATION;
if(location.search.includes('debug'))PENS.forEach(([id])=>{const p=$(id).cloneNode();
  p.setAttribute('stroke','#e0218a');p.setAttribute('stroke-width','1.5');p.removeAttribute('stroke-dasharray');
  document.querySelector('g[transform^="translate(120,41)"]').appendChild(p)});
</script>
