<!-- @dsCard group="Merk" viewport="700x180" name="Shape & radius" subtitle="Square photography and panels; pills only for controls" -->
<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div><div style="width:110px;height:74px;background:var(--sage-400)"></div><div style="font-size:10px;color:var(--ink-300);margin-top:6px">--radius-none · photos, panels, tiles</div></div>
<div><div style="width:150px;height:36px;border-radius:var(--radius-pill);background:var(--green-800)"></div><div style="font-size:10px;color:var(--ink-300);margin-top:6px">--radius-pill · buttons, fields, FAQ rows</div></div>
<div><div style="width:110px;height:74px;border-radius:var(--radius-xs);background:var(--cream-200);border:1px solid var(--border-hairline)"></div><div style="font-size:10px;color:var(--ink-300);margin-top:6px">--radius-xs · textarea only</div></div></div></body></html>
