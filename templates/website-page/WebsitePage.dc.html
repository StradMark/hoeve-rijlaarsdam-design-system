<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Website page" description="Complete paginaopbouw van Hoeve Rijlaarsdam: nav, hero, quotebalk, intro, zalenraster, pillenblok, prijzen, FAQ en de vaste afsluiting." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;background:#fff}</style></helmet>
<div style="font-family:var(--font-body);color:var(--text-body)">
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.NavBar" logo="../../assets/logo-lockup.svg" active="Zakelijk" dc-props="{{ navProps }}" hint-size="100%,88px"></x-import>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.HeroVideo" image="../../assets/photo-koetshuis-bijeenkomst.jpg" kicker="vergaderen in" title="De polder" height="{{ heroHeight }}" hint-size="100%,440px"></x-import>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.QuoteBar" hint-size="100%,46px">&ldquo;Daar waar hospitality een kunstvorm is!&rdquo;</x-import>

<section style="padding:96px 64px"><div style="max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center">
<div>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.SectionHeading" kicker="handige" title="Informatie" size="l" hint-size="100%,110px"></x-import>
<p style="max-width:60ch;margin:24px 0 0;font-size:var(--fs-body-s);line-height:var(--lh-body);color:var(--text-body);text-wrap:pretty">Ruimte om te ontmoeten, te inspireren en te beleven. Een monumentale boerderij in de polder van Nieuwkoop, met vier verhuurbare ruimtes, een beeldentuin van twee hectare en een eigen keuken.</p>
</div>
<div style="aspect-ratio:4 / 3;overflow:hidden"><img src="../../assets/photo-koetshuis-expositie.jpg" alt="" style="width:100%;height:100%;object-fit:cover"></div>
</div></section>

<section style="background:var(--surface-sage);padding:80px 64px"><div style="max-width:1180px;margin:0 auto">
<div style="text-align:center"><x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.SectionHeading" kicker="heel veel" title="Mooie ruimtes" align="center" size="l" tone="onSage" hint-size="100%,110px"></x-import></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px">
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.RoomCard" image="../../assets/photo-koetshuis-expositie.jpg" caption="Koetshuis" tone="onSage" ratio="4 / 3" summary="Vrij indeelbaar, met kunst aan de wand." dc-props="{{ koetshuisProps }}" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.RoomCard" image="../../assets/photo-hooiberg-gedekt.jpg" caption="Hooiberg" tone="onSage" ratio="4 / 3" summary="Rondom ramen, uitzicht over de polder." dc-props="{{ hooibergProps }}" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.RoomCard" image="../../assets/photo-stal-zoettafel.jpg" caption="Stal" tone="onSage" ratio="4 / 3" summary="Ruim honderd jaar oud, met de originele balken." dc-props="{{ stalProps }}" hint-size="100%,300px"></x-import>
</div>
</div></section>

<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.TabbedDetail" kicker="wat viert u" title="Bij ons?" dc-props="{{ tabProps }}" hint-size="100%,520px"></x-import>

<section style="background:var(--surface-deep);padding:80px 64px"><div style="max-width:1180px;margin:0 auto">
<div style="text-align:center;margin-bottom:48px"><x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.SectionHeading" kicker="wat kost" title="Een dag hier" align="center" size="l" tone="onDeep" hint-size="100%,110px"></x-import></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.PriceList" kicker="Zaalhuur" tone="onDeep" note="Alle bedragen zijn exclusief btw." dc-props="{{ zaalhuurProps }}" hint-size="100%,200px"></x-import>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.PriceList" kicker="Extra&rsquo;s" tone="onDeep" dc-props="{{ extrasProps }}" hint-size="100%,200px"></x-import>
</div>
</div></section>

<section style="padding:80px 64px"><div style="max-width:900px;margin:0 auto">
<div style="text-align:center;margin-bottom:40px"><x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.SectionHeading" kicker="veel gestelde" title="Vragen" align="center" size="l" hint-size="100%,110px"></x-import></div>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.FaqAccordion" tone="onLight" dc-props="{{ faqProps }}" hint-size="100%,300px"></x-import>
</div></section>

<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.PageOutro" kicker="kom eens" title="Langs in de polder" body="Loop vrijblijvend een rondje over het erf en door de beeldentuin. Wij vertellen u graag wat er mogelijk is." ctaLabel="Vraag offerte aan" dc-props="{{ outroProps }}" hint-size="100%,720px"></x-import>
<x-import component-from-global-scope="HoeveRijlaarsdamDesignSystem_374762.Footer" dc-props="{{ footerProps }}" hint-size="100%,280px"></x-import>
</div>
</x-dc>

        { label: 'Bruiloft', image: img('photo-bruiloft-ceremonie.jpg'),

}
</script>
</body>
</html>
